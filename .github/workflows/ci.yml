name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: self-hosted

    steps:

    - name: Log start
      run: echo "CI/CD: Pipeline started..."

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        echo "CI/CD: Restoring NuGet packages..."
        dotnet restore

    - name: Build project
      run: |
        echo "CI/CD: Building project..."
        dotnet build --configuration Release --no-restore

    - name: Publish to IIS
      run: |
        echo "CI/CD: Deploying to IIS..."
        dotnet publish -c Release -o "D:\Deploy\MicroservicesSolution"

    - name: Deployment finished
      run: echo "CI/CD: Deployment completed successfully!"
